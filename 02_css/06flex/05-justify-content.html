<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>justify-content</title>
  <link rel="stylesheet" href="defailt.css">
  <style>
    .flex_container{
      display: flex;
      width: 80%;
      margin: 0 auto;
      justify-content: flex-start;/* 아이템들을 시작점으로 정렬하는것 */
      justify-content: flex-end;/* 아이템들을 끝점으로 정렬하는것 */
      justify-content: center;/* 아이템들을 가운데로 정렬하는것 */
      justify-content: space-between;/* 아이템들의 사이에 균일한 간격을 주는것 */
      justify-content: space-around;/* 아이템들의 둘레의 균일한 간격 */
      justify-content: space-evenly;/* 아이템들의 사이와 좌우끝의 균일한 간격 */
      justify-content: center;
      gap: 20px;
    }
  </style>
</head>
<body>
    <div class="flex_container">
    <div class="flex_item">asdasd</div>
    <div class="flex_item">dsadsa</div>
    <div class="flex_item">qweqasdasdasdwe</div>
  </div>
</body>
</html>
