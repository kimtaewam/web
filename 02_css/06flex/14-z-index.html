<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>z-index</title>
  <link rel="stylesheet" href="defailt.css">
  <style>
    .flex_container {
      display: flex;
      height: 100px;
    }

    .flex_item {
      opacity: 0.8;
    }

    .flex_item:nth-child(2) {
      transform: scale(1.5);
      z-index: 10;
    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">aaaaaaaaa</div>
    <div class="flex_item">bbbbbb</div>
    <div class="flex_item">ccccc</div>
  </div>
</body>

</html>
