<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex</title>
  <link rel="stylesheet" href="defailt.css">
  <style>
    .flex_container{
      display: flex;
      flex-wrap: wrap;
      width: 1360px;
      margin: 0 auto;
    }
    .flex_item{
      flex: 1 1 auto;
    }
    .flex_item:nth-child(1){
      width: 30%;
    }
    .flex_item:nth-child(2){
      width: 60%;
    }
    .flex_item:nth-child(3){
      width: 20%;
    }
  </style>
</head>
<body>
  <div class="flex_container">
    <div class="flex_item">
      <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nihil, blanditiis. Repudiandae vitae at corporis eos, quis explicabo sit quidem, aliquid expedita porro perferendis, error et neque iste optio. Saepe, sunt.</p>
    </div>
    <div class="flex_item">bbb</div>
    <div class="flex_item">ccccccc</div>
  </div>
</body>
</html>
