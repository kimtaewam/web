<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>only</title>
<style>
 ul li:nth-of-type(4){
  color: aqua;
 }
 ul li p:only-of-type{
  color: red;
 }
 ul li:only-child{
  color: blueviolet;
 }
</style>
</head>
<body>
  <ul>
    <li>내용1</li>
  </ul>
  <ul>
    <li>
      <p>내용1</p>
      <p>내용2</p>
      <span>인라인</span>
    </li>
    <li>
      <p>내용1</p><span>인라인</span>
    </li>
    <li>
      <p>내용2</p><span>인라인</span>
    </li>
    <li>
      <p>내용3</p><span>인라인</span>
    </li>
    <li>
      <p>내용4</p><span>인라인</span>
    </li>
  </ul>
</body>
</html>
