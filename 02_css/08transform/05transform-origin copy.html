<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transform-origin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    div {
      width: 100px;
      height: 100px;
      border: 1px solid #aaa;
      float: left;
      margin: 50px;
    }

    div p {
      width: 100%;
      height: 100%;
      background: red;
      opacity: 0.5;
      transition: 0.5s;
    }

    div:nth-child(1):hover p {
      transform: scale(1.5);
    }

    div:nth-child(2):hover p {
      transform: rotate(50deg);

    }

    div:nth-child(3):hover p {
      transform: translate(50px,10px);

    }

    div:nth-child(4):hover p {
      transform: skew(20deg,10deg);

    }
  </style>
</head>

<body>
  <div>
    <p></p>
  </div>
  <div>
    <p></p>
  </div>
  <div>
    <p></p>
  </div>
  <div>
    <p></p>
  </div>
</body>

</html>
