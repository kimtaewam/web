<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드뒤집기</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .con {
      width: 300px;
      height: 300px;
      background: #ccc;
      position: relative;
      margin: 400px auto;
      border: 1px solid #fff;
    }

    .con .card {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      transition: 0.6s;
      transform-style: preserve-3d;
      transform-origin: top center;
      background: #ccc;
    }

    .con:hover .card {
      transform: rotateX(180deg);
    }

    .face {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      backface-visibility: hidden;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .front {
      z-index: 2;
    }

    .back {
      transform: rotateX(180deg);
    }
  </style>
</head>

<body>
  <div class="con">
    <div class="card">
      <div class="face front"><img
          src="https://i.namu.wiki/i/ZNGBwmNaV6a3redfFFfnVemHCRFIcPtTM_8_cmpD6gpnYmF9_aiAP_k1cBreyR2Zwnb8u4HqH_07xh5nUm2yFQ.webp"
          alt="조정석앞면"></div>
      <div class="face back"><img
          src="https://i.namu.wiki/i/im0BUvnx_4-b8DMta5aKZjT9dXApJvrgB5eoPuUjxyE5de1xfY5srHjVgdWny8mdfyCOY5kGe1j9kOHKPBSm6A.webp"
          alt="조정석뒷면"></div>
    </div>
  </div>
</body>

</html>
