<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>backface-visiblity<!-- 뒷면이 보이는 속성 --></title>
  <style>
    .container {
      width: 100px;
      height: 100px;
      border: 1px solid #333;
      margin-bottom: 100px;
      position: relative;
    }

    .container .card {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      transition: 0.6s;
      transform-style: preserve-3d;
    }

    .container:hover .card {
      transform: rotateY(180deg);
    }

    .face {
      width: 100%;
      height: 100%;
      left: 0;
      right: 0;
      position: absolute;
    }

    .front {
      background: red;
    }

    .back {
      background: palegoldenrod;
      transform: rotateY(180deg);
      position: absolute;
    }

    .hidden {
      backface-visibility: hidden;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="face front">
        front
      </div><!-- //.face front -->
    </div><!-- //.card -->
  </div><!-- //.container -->

  <div class="container">
    <div class="card">
      <div class="face front hidden">
        front
      </div><!-- //.face front -->
    </div><!-- //.card -->
  </div><!-- //.container -->

  <div class="container">
    <div class="card">
      <div class="face front hidden">
        front
      </div><!-- //.face front -->
      <div class="face back hidden">
        back
      </div><!-- //.back -->
    </div><!-- //.card -->
  </div><!-- //.container -->
</body>

</html>
