<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div{
      width: 500px;
      height: 500px;
      margin: 0;
    }
    .gr1{background: linear-gradient(137deg, color-mix(in oklch, #ff8a1e 77%, transparent) 0%, color-mix(in oklch, #ffe2a6 77%, transparent) 100%);}
    .gr2{ background: radial-gradient(circle at 81% 60%, color-mix(in oklch, #ff8a1e 77%, transparent) 0%, color-mix(in oklch, #f0c570 77%, transparent) 100%);}
    .gr3{background: linear-gradient(219deg, #ff8a1e 0%, #ffe2a6 34%, #22d3ee 68%, #fef3c7 100%);
  background: linear-gradient(219deg, color-mix(in oklch, #ff8a1e 88%, transparent) 0%, color-mix(in oklch, #ffe2a6 88%, transparent) 34%, color-mix(in oklch, #22d3ee 88%, transparent) 68%, color-mix(in oklch, #fef3c7 88%, transparent) 100%);}
    .gr4{background-color: #fef3c7;
  background-image:
    linear-gradient(146deg, rgba(255,255,255,.74) 0 9%, transparent 22% 42%, rgba(255,255,255,.3) 54%, transparent 78%),
    repeating-linear-gradient(134deg, color-mix(in oklch, #ff8a1e 64%, transparent) 0 10px, transparent 10px 50px, color-mix(in oklch, #22d3ee 64%, transparent) 50px 60px, transparent 60px 100px),
    linear-gradient(236deg, color-mix(in oklch, #ffe2a6 78%, black), color-mix(in oklch, #fef3c7 78%, white));
  background-blend-mode: screen, normal, normal;}
    .gr5{background-color: #fef3c7;
  background-image:
    radial-gradient(ellipse at 12% 18%, #ff8a1e 0 18%, transparent 46%),
    radial-gradient(ellipse at 86% 14%, #ffe2a6 0 16%, transparent 44%),
    radial-gradient(ellipse at 66% 84%, #22d3ee 0 22%, transparent 52%),
    radial-gradient(circle at 28% 76%, color-mix(in oklch, #fef3c7 64%, black) 0 18%, transparent 42%),
    radial-gradient(circle, rgba(255,255,255,.18) 0 1px, transparent 1px),
    conic-gradient(from 211deg at 52% 48%, #ff8a1e, #ffe2a6, #22d3ee, #fef3c7, #ff8a1e);
  background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 6px 6px, 100% 100%;
  background-blend-mode: screen, lighten, overlay, multiply, soft-light, normal;
  filter: saturate(1.12);}
    .gr6{background-color: #4c4010;
  background-image:
    repeating-radial-gradient(ellipse at 18% 26%, transparent 0 30px, color-mix(in oklch, #ff8a1e 26%, transparent) 31px 32px, transparent 33px 60px),
    repeating-radial-gradient(ellipse at 82% 72%, transparent 0 34px, color-mix(in oklch, #ffe2a6 24%, transparent) 35px 36px, transparent 37px 66px),
    radial-gradient(circle at 18% 24%, color-mix(in oklch, #ff8a1e 62%, transparent) 0 16%, transparent 46%),
    radial-gradient(circle at 82% 18%, color-mix(in oklch, #22d3ee 62%, transparent) 0 18%, transparent 48%),
    radial-gradient(circle, rgba(255,255,255,.16) 0 1px, transparent 1px),
    linear-gradient(211deg, color-mix(in oklch, #4c4010 84%, white), color-mix(in oklch, #ffe2a6 18%, #4c4010));
  background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 5px 5px, 100% 100%;
  background-blend-mode: multiply, overlay, screen, lighten, soft-light, normal;}
  </style>
</head>
<body>
  <div class="gr1"></div>
  <div class="gr2"></div>
  <div class="gr3"></div>
  <div class="gr4"></div>
  <div class="gr5"></div>
  <div class="gr6"></div>
</body>
</html>
