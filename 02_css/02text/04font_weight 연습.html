<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>폰트 웨이트 연습</title>
  <style>
    h2 {
      font-weight: 100;
    }

    p,
    em {
      font-size: 10;
    }

    strong {
      font-size: 50px;
    }

    i {
      font-weight: 1000;
    }

    b {
      font-style: italic;
    }

    span {
      font-weight: 700;
      color: aqua;
    }

    div {
      margin: 10px;
      color: blueviolet;
      background: palegoldenrod;
      width: 50;
      height: 50;
    }
    address{
      font-size: 20px;
    }
  </style>
</head>

<body>
  <h2>font-weight 속성</h2>
  <p>글자 굵기를 조절하는 속성</p>
  <em>em 태그 : 이탤릭체 강조 / </em>
  <strong>strong 태그: 굵은 글씨 강조 / </strong>
  <i>i 태그 : 이탤릭체 /</i>
  <b>b 태그 : 굵은 글씨 /</b>
  <span>span 태그 : 인라인 묶어줄 때</span>
  <div>div 태그 : 블록 묶어줄 때</div>
  <address><b>웹사이트 관련 주소 넣을때 - 블록, 이탤릭체</b></address>
</body>

</html>
