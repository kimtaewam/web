<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>animation</title>
  <style>
    .box{
      width: 100px;
      height: 100px;
      background: yellow;
      animation: boxani 4s infinite linear;
    }

    @keyframes boxani {
      from{background-color: yellow;
      }
      to{
        background: yellowgreen;
        border: 1px solid yellow;
        border-radius: 50%;
      }
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
