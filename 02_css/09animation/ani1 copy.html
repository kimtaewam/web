<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ani</title>
  <style>
    .box{
      width: 100px;
      height: 100px;
      background: red;
      animation-name: box1;
      animation-duration: 3s;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }

    @keyframes box1 {
      from{
        background: red;
      }
      to{
        background: burlywood;
        border: 1px solid green;
        border-radius: 50%;
      }
      
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
