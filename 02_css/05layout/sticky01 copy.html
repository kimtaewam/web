<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sticky</title>
  <style>
  *{
    margin: 0;
    padding: 0;
  }
  header{
    width: 100%;
    height: 80px;
    background: red;
  }
  main{
    width: 100%;
    height: 1500px;
    background: green;
  }
  section{
    background: yellow;
    width: 80%;
    height: 500px;
    float: left;
  }
  aside{
    background: blue;
    width: 20%;
    height: 300px;
    position: sticky;
    float: right;
    top: 0px;
  }
  footer{
    width: 100%;
    height: 1000px;
  }
  </style>
</head>

<body>
  <header>haeder</header>
  <main class="continer">
    <section class="contens">
      <h2>contens</h2>
    </section>
    <aside>sideber</aside>
  </main>
  <footer>footer</footer>
</body>

</html>
