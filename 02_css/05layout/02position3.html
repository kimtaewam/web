<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>css 포지셔닝</title>
  <style>
    *{margin: 0; padding: 0;}
    #wrap{
      width: 300px;
      height: 300px;
      border: 1px solid #333;
      margin: 0 auto;
      position: relative;
    }
    .box{
      width: 50px;
      height: 50px;
      background: rgba(255,0,255,0.8);
      line-height: 50px;
      text-align: center;
      border-radius: 50%;
      position: absolute;
    }
    .box1{
      right: 0;
      bottom: 0;
    }
    .box2{
      right: 0;
      top: 0;
      /* 또는 바텀 줘도 됨 */
    }
    .box3{
      bottom: 0;
      left: 0;
    }
    .box4{
      left: 125px;
      top: 125px;
      /* % 사용시 (left, top 50%) margin-left : -25px, mragin-top : -25px */
    }
    .box5{
      top: 20%;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="box box1">박스1</div>
    <div class="box box2">박스2</div>
    <div class="box box3">박스3</div>
    <div class="box box4">박스4</div>
    <div class="box box5">박스5</div>
  </div>
</body>
</html>
