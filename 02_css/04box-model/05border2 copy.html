<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>border 속성</title>
  <style>
div{
  width: 100px;
  height: 100px;
margin: 15px;
text-align: center;
line-height: 100px;
background: hotpink;
}
.box1{border: 3px solid blue;}
.box2{
  background-color: transparent;
  border-left: 15px dotted yellow;}
.box3{
  border: 10px double red;
  background-color: aqua;
}
.box4{background-color: brown;
border: 10px groove burlywood;}
.box5{border: 10px inset wheat;}
  </style>
</head>
<body>
  <h2>border 속성</h2>
  <ul>
    <li>테두리 스타일과 두께 색상 등을 묶어 표시</li>
    <li>순서 상관없음</li>
    <li><strong>border : 1px solid #ccc</strong></li>
  </ul>
  <div class="box1">박스1</div>
  <div class="box2">박스2</div>
  <div class="box3">박스3</div>
  <div class="box4">박스4</div>
  <div class="box5">박스5</div>
</body>
</html>
