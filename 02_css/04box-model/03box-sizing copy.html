<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>박스 사이징</title>
  <style>
    div{
      width: 300px;
      height: 200px;
      border: 20px solid red;
      margin: 20px;
      padding: 20px;
    }
    .box1{
      padding: 30px;
      background: orange;
      height: 100px;
      width: 400px;
    }
    .box2{
      box-sizing: content-box;
    }
    .box3{
      box-sizing: border-box;
    }
    .box4{
      width: 200px;
      height: 200px;
      padding: 15px;
      border: 3px dashed #ccc;
    }
  </style>
</head>
<body>
  <div class="box1">box-sizeing = 기본값</div>
  <div class="box2">box-sizeing = 'content-box'</div>
  <div class="box3">box-sizeing = 'border-box'</div>
  <div class="box4">가로사이즈 200px 세로사이즈 200px padding 15px border : 3px dashed #ccc</div>
</body>
</html>
