<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>border</title>
  <style>
    div {
      width: 300px;
      height: 100px;
      margin: 10px;
      display: inline-block;
      background: rgba(234, 0, 0, 0.5);
      border-width: 10px;
    }

    .none {
      border-style: none;
    }

    .hidden {
      border-style: hidden;
    }

    .dashed {
      border-style: dashed;
    }

    .dotted {
      border-style: dotted;
    }

    .double {
      border-style: double;
    }

    .groove {
      border-style: groove;
        border-color: red blue burlywood;
    }

    .inset {
      border-style: inset;
        border-color: red blue burlywood;
    }

    .outset {
      border-style: outset;
        border-color: red, blue, burlywood;
    }

    .ridge {
      border-style: ridge;
        border-color: red, blue, burlywood;
    }

    .solid {
      border-style: solid;
      border-width: 20px 10px;
      border-color: red, green, blue;
    }
    /* 색상 입력시 띄어쓰기 해주기 ,(컴마)안먹음 */
  </style>
</head>

<body>
  <div class="none">none</div>
  <div class="hidden">hidden</div>
  <div class="dashed">dashed</div>
  <div class="dotted">dotted</div>
  <div class="double">double</div>
  <div class="groove">groove</div>
  <div class="inset">inset</div>
  <div class="outset">outset</div>
  <div class="ridge">ridge</div>
  <div class="solid">solid</div>
</body>

</html>
