<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>box-shadow</title>
  <style>
    div{
      width: 150px;
      height: 150px;
      border: 1px double;
      text-align: center;
      line-height: 150px;
      display: inline-block;
      margin: 20px;
    }
    .box1{
      box-shadow: 10px 10px 5px 1px red;
    }
    .box2{
      box-shadow: 1px 1px 10px 1px violet;
    }
    .box3{box-shadow: 2px 5px 12px 12px red inset;}
    .box4{}
    .box5{}
    .box6{}
  </style>
</head>
<body>
  <div class="box1">박스1</div>
  <div class="box2">박스2</div>
  <div class="box3">박스3</div>
  <div class="box4">박스4</div>
  <div class="box5">박스5</div>
  <div class="box6">박스6</div>
</body>
</html>
