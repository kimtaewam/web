<body>
  <ul>
    <li>1</li>
    <li>2</li>
    <li>3</li>
  </ul>

  <ol type="a">
    <li>1</li>
    <li>2</li>
    <li>3</li>
  </ol>


<!-- ol 섹션 추가 -->

<section>
  <h2>목록</h2>
  <ul>
    <li>김춘식</li>
    <li>만득춘</li>
    <li>김방춘</li>
  </ul>
</section>

<section>
  <h2>이름</h2>
  <ol start="10" type="I">
    <li>김춘식</li>
    <li>만득춘</li>
    <li>김방춘</li>
  </ol>
</section>


<!-- ul ol 추가 -->

<h2>1박 2일 명단</h2>
<ul>
  <li>박만배</li>
  <li>박득춘</li>
  <li>문방춘</li>
  <li>김만득</li>
</ul>
<h2>대기자 명단</h2>
<ol reversed>
  <li>박배</li>
  <li>박춘</li>
  <li>김득</li>
</ol>

<!-- dl dt dd 추가 -->

<h2>이름 나이</h2>
<bt>이름</bt>
<dd>김씨</dd>
<dd>박씨</dd>
<dd>이씨</dd>

<h2>나이</h2>
<bt>나이</bt>
<dd>100세</dd>
<dd>654세</dd>
<dd>123135세</dd>



</body>

</html>
