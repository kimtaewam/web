<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cube</title>
  <meta name="description" content="웹퍼블리셔와 디자이너를 위한 무료 복붙 작업대. 파비콘, 웹폰트, 아이콘, CSS 코드를 브라우저에서 바로 만들고 복사합니다." />
  <meta name="keywords" content="파비콘 생성기, OG 이미지, 메타태그, 웹폰트, 무료 복붙" />
  <meta name="author" content="율쌤(yullsem)" />
  <link rel="stylesheet" href="css/style copy.css">
  <link rel="shortcut icon" href="../01animaition/img/favicon.ico" type="image/x-icon">
</head>

<body>
  <main>
    <figure class="background_media">
      <video src="assets/vid2.mp4" class="background_video" poster="assets/vibe_bg.png" autoplay muted loop
        playsinline></video>
    </figure>
    <section class="circle">
      <article class="face_1">
        <h2>Core Signals</h2>
        <div class="inner">
          <div class="signal_card">
            <span class="signal_index">01</span>
            <div class="img_box"></div>
            <h3>Think</h3>
            <em>방향을 먼저 정한다</em>
          </div><!-- //.signal card -->
          <div class="signal_card">
            <span class="signal_index">02</span>
            <div class="img_box"></div>
            <h3>Shape</h3>
            <em>생각을 구조로 바꾼다</em>
          </div><!-- //.signal card -->
          <div class="signal_card">
            <span class="signal_index">03</span>
            <div class="img_box"></div>
            <h3>Make</h3>
            <em>AI와 함께 제작한다</em>
          </div><!-- //.signal card -->
          <div class="signal_card">
            <span class="signal_index">04</span>
            <div class="img_box"></div>
            <h3>Output</h3>
            <em>보이는 결과로 남긴다</em>
          </div><!-- //.signal card -->
          <div class="signal_card">
            <span class="signal_index">05</span>
            <div class="img_box"></div>
            <h3>Iterate</h3>
            <em>Own</em>
          </div><!-- //.signal card -->
          <div class="signal_card">
            <span class="signal_index">06</span>
            <div class="img_box"></div>
            <h3>Own</h3>
            <em>이름과 기준을 가진다</em>
          </div><!-- //.signal card -->
        </div><!-- //.inner -->
      </article><!-- //.face_1 -->
    </section>

  </main>
</body>

</html>
