<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>


  <!-- https://michalsnik.github.io/aos/ -->
  <!-- https://github.com/michalsnik/aos -->

  <!-- //  AOS 초기화 (스크롤 애니메이션) js 파일에 삽입
  AOS.init({
    disable: false,                //  AOS 끄지 않기! → 애니메이션 작동하게 두기
    startEvent: 'DOMContentLoaded', //  HTML이 다 불러와지면 바로 AOS 시작!
    initClassName: 'aos-init',      //  AOS가 준비됐다는 표시 클래스 (자동 붙음)
    animatedClassName: 'aos-animate', //  애니메이션이 실행될 때 붙는 클래스 이름
    useClassNames: false,           //  HTML에 data-aos 값 그대로 클래스 안 붙이기
    disableMutationObserver: false, //  새로 생긴 요소도 자동 감시해서 애니메이션 적용
    debounceDelay: 50,              //  창 크기 바꿀 때 0.05초 기다렸다 계산 (너무 자주 안 하게)
    throttleDelay: 99               //  스크롤할 때 0.099초마다 한 번씩 체크 (성능 좋게!)
  }); -->

  <!-- 
  data-aos-offset : 애니메이션이 시작되는 트리거 포인트(뷰포트에서 요소까지의 거리)를 픽셀단위로 설정합니다
  <div data-aos="fade-up" data-aos-offset="200">내용</div>

  data-aos-delay : 애니메이션 시작 전에 지연시킬 시간(밀리초)을 지정합니다.
  <div data-aos="fade-up" data-aos-delay="300">내용</div>
  
  data-aos-duration : 애니메이션이 진행되는 시간을 밀리초 단위로 설정합니다.
  <div data-aos="fade-up" data-aos-duration="800">내용</div>
  
  data-aos-easing : 애니메이션의 가속/감속 효과를 제어하는 easing 함수를 지정합니다.
  <div data-aos="fade-up" data-aos-easing="ease-in-out">내용</div>

  data-aos-onec : 해당 요소가 애니메이션을 단 한번만 실행하도록 설정합니다.
  <div data-aos="fade-up" data-aos-once="true">내용</div>

  data-aos-mirror : 스크롤을 다시 위로 올릴때 애니메이션을 반대로 실행할지 정하는 속성.
  한번 나타난 애니메이션이 스크롤 반대방향에서 다시 사라지듯 동작할지 정합니다.
  <div data-aos="fade-up" data-aos-mirror="true">  내용</div>

  data-aos-anchor-placement : 애니메이션 시작 시점으로 사용할 요소의 위치를 정의합니다.
  이 속성은 요소와 뷰포트 중 어느 부분이 기준이 될지 정합니다.
  "top-bottom" , "center-center"
  <div data-aos="fade-up" data-aos-anchor-placement="top-center">내용</div>
  -->



</body>

</html>
