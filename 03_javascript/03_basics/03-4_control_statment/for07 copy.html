<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구구단</title>
</head>

<body>
  <script>
    //2*1=2
    //2*2=4
    //2*3=6

    for(let i =2;i<10;i++){
      document.write(i+'단<br>')
      for(let z=1;z<10;z++){
        document.write(i+'X'+z+'='+(i*z)+'<br>')
      }
    }


  </script>
</body>

</html>
