  <script>
    //undefined 데이터는 변수를 선언하였으나 데이터 값을 지정하지 않았을 경우
    let temp;
    console.log(temp);

    //객체의 속성값을 지정하지 않았을 경우 자동으로 지정되는 값이다. <- 콘솔창에 undefined라고 뜸
    let obj = {name:'김태완',age:33};
    obj.job = '디자이너';
    console.log(obj.name);
    console.log(obj.age);
    console.log(obj.job);
    console.log(obj.job2);
