<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let con1 = 10;
    let con2 = 2;
    let con;
    con = con1 + con2
    console.log(con)
    document.write(con)

    con = con1 - con2;
    console.log(con)
    document.write(`<br>${con}`)

    con = con1 * con2;
    console.log(con)
    document.write(`<br>${con}`)

    con = con1 / con2;
    console.log(con)
    document.write(`<br>${con}`)

    con = con1 % con2;
    console.log(con)
    document.write(`<br>${con}`)

  </script>
</body>

</html>
